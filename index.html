<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="SwiftPay TrustFix - Secure fintech experience"
    >

    <title>SwiftPay | Secure Login</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <main class="app">

        <!-- =========================
             LOGIN SCREEN
             ========================= -->

        <section
            id="loginScreen"
            class="screen active"
        >

            <div class="brand">

                <div class="brand-logo">
                    S
                </div>

                <div class="brand-text">

                    <h1>SwiftPay</h1>

                    <p>
                        Your money. Your control.
                    </p>

                </div>

            </div>


            <div class="login-card">

                <div class="login-header">

                    <h2>
                        Welcome back
                    </h2>

                    <p>
                        Sign in securely to continue.
                    </p>

                </div>


                <form id="loginForm">

                    <div class="form-group">

                        <label for="loginInput">
                            Phone number or email
                        </label>

                        <input
                            type="text"
                            id="loginInput"
                            name="loginInput"
                            placeholder="+234 801 234 5678"
                            autocomplete="username"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="passwordInput">
                            Password
                        </label>

                        <input
                            type="password"
                            id="passwordInput"
                            name="passwordInput"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >

                    </div>


                    <button
                        type="submit"
                        class="primary-button"
                    >
                        Sign in
                    </button>

                </form>


                <button
                    type="button"
                    class="forgot-password"
                >
                    Forgot password?
                </button>


                <div class="security-box">

                    <div class="security-icon">
                        🔒
                    </div>

                    <div>

                        <strong>
                            Secure connection
                        </strong>

                        <p>
                            Your personal and financial
                            information is protected.
                        </p>

                    </div>

                </div>

            </div>


            <footer class="login-footer">

                <span>Privacy</span>

                <span>•</span>

                <span>Security</span>

                <span>•</span>

                <span>Help</span>

            </footer>

        </section>

    </main>

    <script src="script.js"></script>

</body>

</html>
